name: Keepalive — Otimizador Portfolio

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos — impede hibernação no Render Free Tier
  workflow_dispatch:           # permite acionar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://otimizador-portfolio.onrender.com)
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Aviso: resposta inesperada ($STATUS)"
            exit 1
          fi
